static String getGitWorkingBranch() {
    try {
        def gitProcess = "git rev-parse --abbrev-ref HEAD".execute()
        gitProcess.waitFor()
        if (gitProcess.exitValue() == 0) {
            return gitProcess.text.trim()
        } else {
            // not a git repository
            return ""
        }
    } catch (IOException ignored) {
        // git was not found
        return ""
    }
}

// --- Fork release versioning (additive; deliberately does NOT edit upstream's versionCode /
// versionName lines above, so `git rebase upstream/main` never conflicts on versioning and the
// fork tracks upstream's version automatically). CI passes -PforkVersionName / -PforkVersionCode
// to stamp a fork-suffixed version onto a release; local/default builds inherit upstream's exact
// version. Upstream's androidComponents.onVariants block reads android.defaultConfig.versionName /
// versionCode lazily (inside the closure, after this script runs), so it picks up the values set
// here; the per-ABI (100 * versionCode + abiCode) logic still applies on top of the injected base. ---
if (project.hasProperty('forkVersionName')) {
    android.defaultConfig.versionName = project.forkVersionName
}
if (project.hasProperty('forkVersionCode')) {
    android.defaultConfig.versionCode = project.forkVersionCode.toInteger()
}

// --- Fork (PipePipeD) install identity: override the base applicationId additively so upstream's
// defaultConfig line stays untouched (rebase-clean; same rationale as the forkVersion block above).
// Yields wtf.pipepiped.release / wtf.pipepiped.debug via the per-variant applicationIdSuffix. ---
android.defaultConfig.applicationId = "wtf.pipepiped"

// --- Fork build-speed: ABI gating (additive; reconfigures android.splits.abi AFTER the android{}
// block instead of editing upstream's splits{} DSL, so `git rebase upstream/dev` never conflicts
// here). Absent => upstream's default (per-ABI armeabi-v7a/arm64-v8a/x86/x86_64, no universal). A
// personal fork installed via Obtainium only needs one APK, so trimming unused ABIs skips their
// packaging + signing.
//   -PforkAbiFilter=universal            => a single all-architecture (universal) APK only
//   -PforkAbiFilter=arm64-v8a            => only that per-ABI APK (no universal)
//   -PforkAbiFilter=arm64-v8a,universal  => that per-ABI APK + a universal APK
// AGP finalizes the splits DSL after this script is evaluated (before its onVariants closures run),
// so end-of-script reconfiguration is honoured. For the universal-only case we simply disable
// per-ABI splits: the single resulting output contains all ABIs, and upstream's onVariants filename
// template already names it "PipePipe_<version>-universal-<buildType>.apk" (abi resolves to null),
// so no filename rewrite is needed on our side anymore. ---
if (project.hasProperty('forkAbiFilter')) {
    def requestedAbis = project.forkAbiFilter.split(',').collect { it.trim().toLowerCase() }.findAll { it }
    def wantUniversal = requestedAbis.contains('universal')
    def perAbi = requestedAbis.findAll { it != 'universal' }
    if (perAbi.isEmpty()) {
        // Universal only: one fat APK (all ABIs' native libs). Disabling per-ABI splits is faster
        // than building every split; upstream's onVariants names the sole output "-universal-".
        android.splits.abi.enable = false
    } else {
        android.splits.abi.reset()
        android.splits.abi.enable = true
        android.splits.abi.include(*perAbi)
        android.splits.abi.universalApk = wantUniversal
    }
}

// --- Fork build-speed: R8/minification toggle (additive; same rebase-safe rationale as the
// forkAbiFilter + forkVersion blocks above -- reconfigures android.buildTypes.release AFTER the
// android{} block instead of editing upstream's buildTypes{} DSL, so `git rebase upstream/main`
// never conflicts here). Upstream sets `minifyEnabled true` (R8 shrink/obfuscate) on the release
// build; R8 is the release-only step that makes a release build noticeably slower than a debug
// build. A personal fork distributed via Obtainium needs neither code shrinking nor obfuscation,
// so `-PforkMinify=false` (the CI + nix default) skips R8 to cut that cost. Absent => upstream's
// minified release is unchanged (keeps a bare `./gradlew :app:assembleRelease` byte-for-byte
// upstream for F-Droid reproducibility); pass -PforkMinify=true to force upstream's behaviour.
// `shrinkResources` is already false upstream, so disabling minify needs no further change and the
// proguardFiles simply go unused. AGP finalises buildTypes in afterEvaluate, so end-of-script
// reconfiguration is honoured (same timing the blocks above rely on). ---
if (project.hasProperty('forkMinify')) {
    android.buildTypes.release.minifyEnabled = project.forkMinify.toBoolean()
}
