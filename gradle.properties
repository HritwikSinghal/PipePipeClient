android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096M
org.gradle.unsafe.configuration-cache=true
systemProp.file.encoding=utf-8
org.gradle.unsafe.configuration-cache-problems=warn
# Fork build-speed (additive): build the app/extractor/ffmpeg modules in parallel and reuse the
# local build cache so unchanged sources are not recompiled. Heap bumped 2G->4G to avoid GC thrash
# under parallel workers. Configuration cache is already enabled upstream (line above).
org.gradle.parallel=true
org.gradle.caching=true

